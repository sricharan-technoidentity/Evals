[project]
name = "inspect-sdlc-evals"
version = "0.2.0"
description = "POC: evaluate a ticket-to-PR coding agent with Inspect AI on a Java and a TypeScript repo"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai==0.3.280",
    "anthropic",
]

# Registers the `kiro/<model>` model provider with Inspect.
[project.entry-points.inspect_ai]
sdlc_evals = "sdlc_evals._registry"

[tool.setuptools]
packages = ["sdlc_evals"]
